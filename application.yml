spring:
  application:
    name: teacherdash-backend
    
  # ============================================
  # BANCO DE DADOS - PostgreSQL + Supabase
  # ============================================
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/teacherdash}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # ============================================
  # JPA + HIBERNATE
  # ============================================
  jpa:
    hibernate:
      ddl-auto: validate # validate, update, create, create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
  
  # ============================================
  # SEGURANÇA - JWT
  # ============================================
  security:
    jwt:
      secret: ${JWT_SECRET:your-secret-key-change-in-production-very-long-secret-key-for-security}
      expiration: ${JWT_EXPIRATION:86400000} # 24 horas em ms

  # ============================================
  # SUPABASE (se precisar integração direta)
  # ============================================
  supabase:
    url: ${SUPABASE_URL:https://your-project.supabase.co}
    key: ${SUPABASE_KEY:your-anon-key}
    jwt-secret: ${SUPABASE_JWT_SECRET:your-jwt-secret}
  
  # ============================================
  # JACKSON (JSON)
  # ============================================
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
    time-zone: America/Sao_Paulo
  
  # ============================================
  # SERVLET
  # ============================================
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ============================================
# SERVIDOR
# ============================================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: 
      - application/json
      - application/xml
      - text/html
      - text/xml
      - text/plain

# ============================================
# LOGGING
# ============================================
logging:
  level:
    root: INFO
    com.teacherdash: DEBUG
    org.springframework.security: DEBUG
    org.hibernate: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/teacherdash.log
    max-size: 10MB
    max-history: 10

# ============================================
# ACTUATOR (Monitoring)
# ============================================
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# ============================================
# SPRINGDOC OPENAPI (Swagger)
# ============================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true

# ============================================
# PERFIS
# ============================================
---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
  jackson:
    serialization:
      indent-output: true

logging:
  level:
    root: DEBUG
    com.teacherdash: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  jackson:
    serialization:
      indent-output: false

logging:
  level:
    root: WARN
    com.teacherdash: INFO

server:
  compression:
    enabled: true
